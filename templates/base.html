<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StartupIQ{% endblock %} – Futuristic AI Intelligence Platform</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Orbitron & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom Futuristic HUD CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <!-- Animated Futuristic Background Grid & Ambient Glows -->
    <div id="hud-bg-container">
        <div class="hud-grid-pattern"></div>
        <div class="hud-glow-orb-1"></div>
        <div class="hud-glow-orb-2"></div>
        <div class="hud-scanner-line"></div>
    </div>

    <div class="d-flex">
        <!-- Include Sidebar Component -->
        {% include 'sidebar.html' %}

        <!-- Main Content Wrapper -->
        <div class="main-content flex-grow-1" style="margin-left: 260px; transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1); min-height: 100vh; display: flex; flex-direction: column;">
            
            <!-- Include Navbar Component -->
            {% include 'navbar.html' %}
            
            <!-- Page Content Wrapper -->
            <div class="page-content p-4 flex-grow-1">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    
    <!-- Lucide Icons Initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>

    <!-- Handle layout transition based on sidebar collapse state -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.querySelector('.main-content');
            const desktopToggleBtn = document.getElementById('desktopSidebarToggle');
            
            if (desktopToggleBtn && mainContent && sidebar) {
                desktopToggleBtn.addEventListener('click', () => {
                    if (sidebar.classList.contains('collapsed')) {
                        mainContent.style.marginLeft = '75px';
                    } else {
                        mainContent.style.marginLeft = '260px';
                    }
                });
            }
            
            // Initial Responsive Setup
            function updateLayout() {
                if (!mainContent || !sidebar) return;
                if (window.innerWidth < 768) {
                     mainContent.style.marginLeft = '0';
                } else if (window.innerWidth < 992) {
                     mainContent.style.marginLeft = '75px';
                } else {
                     mainContent.style.marginLeft = sidebar.classList.contains('collapsed') ? '75px' : '260px';
                }
            }
            
            updateLayout();
            window.addEventListener('resize', updateLayout);
        });
    </script>
    <!-- Active Sidebar Link Detection -->
    <script>
        (function() {
            const path = window.location.pathname;
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.remove('active');
                const href = link.getAttribute('href');
                if (!href) return;
                if (path === href || (href !== '/' && path.startsWith(href))) {
                    link.classList.add('active');
                }
                if ((path === '/' || path === '') && href === '/') {
                    link.classList.add('active');
                }
            });
        })();
    </script>
</body>
</html>
